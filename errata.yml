name: Report an error in the book
description: A command, configuration, or statement in the book that doesn't work or isn't correct
title: "[Errata] p.<page> <section>: <short description>"
labels: ["errata"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the book. Every report is reproduced in the lab before it is corrected.
        Confirmed errors are credited in ERRATA.md and in the next printing (see the Errata Bounty in the README).
  - type: input
    id: location
    attributes:
      label: Page and section
      placeholder: "p. 283, Section 11.1.4"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Copy the exact command or configuration from your terminal.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the full error message or output.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `lsb_release -a` and `uname -r`, plus the package version if relevant (for example, `dpkg -l nginx`).
      render: text
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name for the credits (optional)
      description: How you'd like to be credited if the error is confirmed. Leave blank to stay anonymous.
